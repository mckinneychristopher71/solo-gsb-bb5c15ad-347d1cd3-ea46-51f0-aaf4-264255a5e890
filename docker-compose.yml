services:
  invoice-api:
    build: .
    image: invoice-tax-api:latest
    container_name: invoice-tax-api
    restart: unless-stopped
    ports:
      # 宿主机端口:容器端口；宿主机端口可用环境变量 API_PORT 覆盖
      - "${API_PORT:-8000}:8000"
    environment:
      # SQLite 数据库文件路径（位于挂载卷内）
      DB_PATH: /data/invoices.db
      # 可选：追加/覆盖币种小数位，如 "KWD:3,XYZ:0"
      CURRENCY_DIGITS: "${CURRENCY_DIGITS:-}"
    volumes:
      - invoice-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request,sys; r=urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3); sys.exit(0 if json.load(r)['status']=='ok' else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  invoice-data:
